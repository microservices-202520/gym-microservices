server.port=8085
spring.application.name=gateway-service

# Eureka Configuration for Docker
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gateway-service
eureka.client.enabled=true

# Spring Cloud Gateway Configuration for Docker with Load Balancer
# Using Eureka service discovery with load balancing
spring.cloud.gateway.routes[0].id=miembro-service
spring.cloud.gateway.routes[0].uri=lb://miembro-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/miembros/**

spring.cloud.gateway.routes[1].id=entrenador-service
spring.cloud.gateway.routes[1].uri=lb://entrenador-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/entrenadores/**

spring.cloud.gateway.routes[2].id=clase-service
spring.cloud.gateway.routes[2].uri=lb://clase-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/clases/**

spring.cloud.gateway.routes[3].id=equipo-service
spring.cloud.gateway.routes[3].uri=lb://equipo-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/equipos/**

# Load Balancer Configuration
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,gateway,routes
management.endpoint.health.show-details=always

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG

# OAuth2 Resource Server Configuration for Docker
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://host.docker.internal:8080/realms/gimnasio
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://host.docker.internal:8080/realms/gimnasio/protocol/openid-connect/certs

# Keycloak Configuration
keycloak.auth-server-url=http://host.docker.internal:8080/auth
keycloak.realm=gimnasio
keycloak.resource=gateway-service
keycloak.public-client=false
