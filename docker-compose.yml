  version: '3.8'

  services:
    # RabbitMQ Broker
    
    # Miembro Service
    miembro-service:
      build: ./miembro-service
      ports:
        - "8081:8081"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_RABBITMQ_HOST=rabbitmq
        - SPRING_RABBITMQ_PORT=5672
      networks:
        - gimnasio-network
      depends_on:
        - rabbitmq

    # Entrenador Service
    entrenador-service:
      build: ./entrenador-service
      ports:
        - "8082:8082"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_RABBITMQ_HOST=rabbitmq
        - SPRING_RABBITMQ_PORT=5672
      networks:
        - gimnasio-network
      depends_on:
        - rabbitmq

    # Clase Service
    clase-service:
      build: ./clase-service
      ports:
        - "8083:8083"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - ENTRENADOR_SERVICE_URL=http://entrenador-service:8082
        - SPRING_RABBITMQ_HOST=rabbitmq
        - SPRING_RABBITMQ_PORT=5672
      networks:
        - gimnasio-network
      depends_on:
        - entrenador-service
        - rabbitmq

    # Equipo Service
    equipo-service:
      build: ./equipo-service
      ports:
        - "8084:8084"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - SPRING_RABBITMQ_HOST=rabbitmq
        - SPRING_RABBITMQ_PORT=5672
      networks:
        - gimnasio-network

    # Gateway Service
    gateway-service:
      build: ./gateway-service
      ports:
        - "8085:8085"
      environment:
        - SPRING_PROFILES_ACTIVE=docker
        - MIEMBRO_SERVICE_URL=http://miembro-service:8081
        - ENTRENADOR_SERVICE_URL=http://entrenador-service:8082
        - CLASE_SERVICE_URL=http://clase-service:8083
        - EQUIPO_SERVICE_URL=http://equipo-service:8084
        - SPRING_RABBITMQ_HOST=rabbitmq
        - SPRING_RABBITMQ_PORT=5672
      networks:
        - gimnasio-network
      depends_on:
        - miembro-service
        - entrenador-service
        - clase-service
        - equipo-service
        - rabbitmq

    # Add RabbitMQ env to existing services

    rabbitmq:
      image: rabbitmq:3.13-management
      ports:
        - "5672:5672"      # AMQP
        - "15672:15672"    # Management UI
      environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest
      networks:
        - gimnasio-network
    
    zookeeper:
      image: confluentinc/cp-zookeeper:latest
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      ports:
        - "22181:2181"
      networks:
        - gimnasio-network

    kafka:
      image: confluentinc/cp-kafka:7.5.0
      depends_on:
        - zookeeper
      ports:
        - "29092:29092"
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      networks:
        - gimnasio-network

  networks:
    gimnasio-network:
      driver: bridge
